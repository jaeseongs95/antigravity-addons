name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite (Linux headless Electron via xvfb-run)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run full test suite (Windows native Electron)
        if: runner.os == 'Windows'
        run: npm test
